name: hesam_void
description: "Hesam Void - Professional VPN Configuration Manager with advanced protocol support for VLESS, VMess, Trojan, Shadowsocks, SSH"
publish_to: 'none'
version: 4.0.5+22

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: 6.1.5+1

  # Local Storage (Secure)
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_secure_storage: 9.2.4
  package_info_plus: ^8.3.1
  
  # Networking & HTTP
  http: 1.5.0
  
  # V2Ray VPN Core - Real tunneling support
  flutter_v2ray: 1.0.9
  
  # SSH Tunneling - Real SSH connection support
  dartssh2: ^2.13.0
  
  # QR Code
  qr_flutter: 4.1.0
  mobile_scanner: 7.0.1
  
  # UI Enhancements
  google_fonts: 6.2.1
  flutter_animate: 4.5.2
  shimmer: 3.0.0
  
  # Utilities
  uuid: 4.5.1
  intl: 0.20.2
  share_plus: 10.1.4
  url_launcher: 6.3.1
  path_provider: 2.1.5

dependency_overrides:
  # The upstream 3.1.2 Windows implementation depends on ATL headers that are
  # absent from standard hosted runners. This audited local patch uses native
  # UTF-8/UTF-16 conversion APIs and preserves Credential Manager behavior.
  flutter_secure_storage_windows:
    path: packages/flutter_secure_storage_windows_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    # Downloaded only by the Windows CI/release workflow; Git contains .gitkeep only.
    - assets/runtime/win32/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
