name: hesam_void
description: "Hesam Void - Professional VPN Configuration Manager with advanced protocol support for VLESS, VMess, Trojan, Shadowsocks, SSH"
publish_to: 'none'
version: 3.2.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: 6.1.5+1

  # Local Storage (Secure)
  hive: 2.2.3
  hive_flutter: 1.1.0
  
  # Networking & HTTP
  http: 1.5.0
  
  # V2Ray VPN Core - Real tunneling support
  flutter_v2ray: 1.0.9
  
  # QR Code
  qr_flutter: 4.1.0
  mobile_scanner: 7.0.1
  
  # UI Enhancements
  google_fonts: 6.2.1
  flutter_animate: 4.5.2
  shimmer: 3.0.0
  
  # Utilities
  uuid: 4.5.1
  intl: 0.20.2
  share_plus: 10.1.4
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
