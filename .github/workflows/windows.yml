name: Windows 4SUPER

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 4SUPER
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # Flutter 3.35.4 falls back to VS2019 when its detector cannot parse a
      # newer instance. Patch only the cached SDK in this ephemeral runner so
      # CMake selects the VS2022 toolchain available on windows-latest.
      - name: Align Flutter CMake fallback with VS2022 runner
        shell: pwsh
        run: |
          $tool = Join-Path $env:FLUTTER_ROOT 'packages\flutter_tools\lib\src\windows\visual_studio.dart'
          $content = Get-Content -Raw $tool
          $content = $content.Replace("_ => 'Visual Studio 16 2019'", "_ => 'Visual Studio 17 2022'")
          Set-Content -NoNewline -Path $tool -Value $content
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:FLUTTER_ROOT 'bin\cache\flutter_tools.snapshot')
          flutter --version

      - name: Fetch signed Xray and Wintun runtime
        shell: pwsh
        run: ./tools/windows/fetch_runtime.ps1

      - name: Fetch packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\hesam_void_4super.iss'

      - name: Create checksums
        shell: pwsh
        run: |
          $file = Get-Item dist\windows\Hesam-Void-4SUPER-Windows-Setup.exe
          "$((Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant())  $($file.Name)" | Set-Content -NoNewline dist\windows\SHA256SUMS-windows.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesam-void-4super-windows-setup
          path: |
            dist/windows/Hesam-Void-4SUPER-Windows-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Hesam-Void-4SUPER-Windows-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          generate_release_notes: true
