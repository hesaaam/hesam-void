name: Windows 4SUPER

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows 4SUPER
    # Flutter 3.35.4 selects the VS2019 CMake generator; use the matching
    # GitHub-hosted image instead of letting windows-latest resolve to VS2022.
    runs-on: windows-2019
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Fetch signed Xray and Wintun runtime
        shell: pwsh
        run: ./tools/windows/fetch_runtime.ps1

      - name: Fetch packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\hesam_void_4super.iss'

      - name: Create checksums
        shell: pwsh
        run: |
          $file = Get-Item dist\windows\Hesam-Void-4SUPER-Windows-Setup.exe
          "$((Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant())  $($file.Name)" | Set-Content -NoNewline dist\windows\SHA256SUMS-windows.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesam-void-4super-windows-setup
          path: |
            dist/windows/Hesam-Void-4SUPER-Windows-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Hesam-Void-4SUPER-Windows-Setup.exe
            dist/windows/SHA256SUMS-windows.txt
          generate_release_notes: true
