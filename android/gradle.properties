# Keep Android builds stable on constrained developer machines and CI.
# GitHub Actions needs additional heap while Jetifying Flutter native libraries.
# For RAM-constrained local machines, override with GRADLE_OPTS or a user-level gradle.properties.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
