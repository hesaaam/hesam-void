# Keep Android builds stable on constrained developer machines and CI.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
